<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Peekaboo AR</title>
  <style>
    /* S1: 전체 화면 비디오 + 같은 크기 캔버스 */
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; }
    #video, #canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #canvas { touch-action: none; }
    #hud {
      position: absolute; top: env(safe-area-inset-top, 0); left: 0; margin: 8px;
      padding: 6px 8px; background: rgba(0,0,0,.55); color: #0f0; font: 12px/1.4 ui-monospace, monospace;
      white-space: pre; border-radius: 6px; pointer-events: none; z-index: 3;
    }
    #msg {
      position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 116px); text-align: center; color: #fff;
      font-size: 17px; text-shadow: 0 1px 4px #000; padding: 0 24px; pointer-events: none; z-index: 3; /* S16: 캐릭터를 가리지 않게 셔터 위로 */
    }
    #msg:empty { display: none; }
    #start {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      padding: 16px 28px; font-size: 18px; border: 0; border-radius: 999px; background: #ffd54f; z-index: 4;
    }
    #start[hidden] { display: none; }
    /* S21: 시작 메뉴·찾기 배너·숨기기 카드 */
    #menu { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); }
    #menu[hidden], #seekbar[hidden], #hidebtn[hidden], #hidecard[hidden], #arrow[hidden], #bypass[hidden] { display: none; }
    #menu .card, #hidecard .card { background: #fff; border-radius: 16px; padding: 18px; width: min(90vw, 360px); color: #222; display: flex; flex-direction: column; gap: 10px; }
    #menu h1 { margin: 0 0 4px; font-size: 20px; }
    #menu button, #hidecard button { padding: 12px; border: 0; border-radius: 12px; background: #f1ede4; color: #222; font-size: 15px; }
    #menu button.primary, #hidecard button.primary { background: #ffd54f; color: #4a3700; font-weight: 700; }
    #menu button.ghost, #hidecard button.ghost { background: transparent; color: #777; }
    #menu small { color: #888; font-size: 12px; text-align: center; }
    #seekbar { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 150px); left: 50%; transform: translateX(-50%); z-index: 4;
      display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; font-size: 18px; font-weight: 700; white-space: nowrap; }
    #seekbar #arrow { display: inline-block; font-size: 26px; color: #ffd54f; transform-origin: 50% 50%; transition: transform .2s; }
    #seekbar #bypass { padding: 6px 10px; border: 0; border-radius: 999px; background: #ffd54f; color: #4a3700; font-size: 12px; }
    #hidebtn { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 160px); transform: translateX(-50%); z-index: 4;
      padding: 14px 26px; border: 0; border-radius: 999px; background: #ffd54f; color: #4a3700; font-size: 17px; font-weight: 700; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
    #hidecard { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); }
    #hidecard h2 { margin: 0; font-size: 20px; }
    #hidecard #hc-sp { font-size: 16px; font-weight: 700; }
    #hidecard #hc-geo, #hidecard #hc-msg { font-size: 12px; color: #666; }
    #hidecard textarea { width: 100%; box-sizing: border-box; font-size: 11px; color: #555; border: 1px solid #ddd; border-radius: 8px; padding: 6px; }
    #hidecard .row { display: flex; gap: 8px; } #hidecard .row button, #hidecard .row input, #hidecard .row select { flex: 1; min-width: 0; }
    /* S22 */
    #hidecard input, #hidecard select { padding: 9px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; box-sizing: border-box; width: 100%; }
    #hidecard .chk { font-size: 12px; color: #555; display: flex; align-items: center; gap: 6px; }
    #hidecard #hc-count { font-size: 12px; color: #4a3700; background: #fff3d6; padding: 4px 8px; border-radius: 8px; align-self: flex-start; }
    #seekbar[data-heat="hot"] { background: rgba(200,40,40,.85); } #seekbar[data-heat="warm"] { background: rgba(230,120,20,.85); } #seekbar[data-heat="cold"] { background: rgba(30,80,180,.8); }
    #tchip { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 200px); right: 8px; z-index: 4; padding: 8px 12px; border: 0; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; font-weight: 700; }
    #tchip[hidden], #targets[hidden], #m-draft[hidden], #m-hides-wrap[hidden] { display: none; }
    #targets { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); }
    #targets .card { background: #fff; border-radius: 16px; padding: 16px; width: min(92vw, 380px); color: #222; max-height: 80vh; overflow-y: auto; }
    #targets h2 { margin: 0 0 4px; font-size: 18px; } #targets #tsum { font-size: 13px; color: #666; margin-bottom: 8px; }
    .trow { display: flex; gap: 8px; align-items: center; padding: 10px; border-radius: 10px; background: #f4f4f4; margin-bottom: 6px; font-size: 13px; }
    .trow b { color: #4a3700; background: #ffd54f; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .trow span { flex: 1; } .trow em { font-style: normal; color: #888; } .trow.found { opacity: .55; } .trow.cur { outline: 2px solid #ffd54f; }
    #targets small { color: #888; font-size: 11px; }
    .mrow { display: flex; gap: 6px; align-items: center; font-size: 13px; background: #fff3d6; padding: 8px 10px; border-radius: 10px; }
    .mrow span { flex: 1; } .mrow button { padding: 6px 10px !important; font-size: 12px !important; }
    .mlabel { font-size: 12px; color: #888; }
    .hrow { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #444; padding: 4px 0; } .hrow span { flex: 1; } .hrow button { padding: 5px 10px !important; font-size: 12px !important; }
    /* S5: 셔터 버튼 */
    #shutter {
      position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
      width: 72px; height: 72px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.35);
      box-shadow: 0 0 0 3px rgba(0,0,0,.35); z-index: 4; padding: 0;
    }
    #shutter:active { background: #fff; }
    #shutter[hidden] { display: none; }
    /* S7: 도감 배지·패널 */
    #badge {
      position: absolute; top: calc(env(safe-area-inset-top, 0px) + 8px); right: 8px; z-index: 4;
      padding: 8px 12px; border: 0; border-radius: 999px; background: rgba(0,0,0,.55); color: #ffd54f; font-weight: 700; font-size: 14px;
    }
    #badge[hidden] { display: none; }
    #panel { position: absolute; inset: 0; background: rgba(0,0,0,.6); z-index: 5; display: flex; align-items: center; justify-content: center; }
    #panel[hidden] { display: none; }
    #panel .card { background: #fff; border-radius: 16px; padding: 16px; width: min(92vw, 380px); color: #222; }
    #panel h2 { margin: 0 0 4px; font-size: 18px; }
    #panel #home { font-size: 13px; color: #666; margin-bottom: 12px; }
    /* S13: 세트별 도감 그리드 */
    #panel .card { max-height: 86vh; overflow-y: auto; }
    #slots { display: flex; flex-direction: column; gap: 10px; }
    .group h3 { margin: 0 0 6px; font-size: 14px; }
    .group h3 small { color: #888; font-weight: 400; margin-left: 6px; }
    .group h3 em { font-style: normal; background: #ffd54f; color: #4a3700; font-size: 11px; padding: 0 8px; border-radius: 999px; margin-left: 6px; }
    .group .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .slot { position: relative; text-align: center; font-size: 11px; line-height: 1.25; color: #999; background: #f4f4f4; border-radius: 12px; padding: 6px 2px; }
    .slot::before { content: ''; position: absolute; top: 6px; left: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--rar, #ccc); }
    .slot.got { color: #222; background: #fff3d6; }
    .slot canvas { width: 56px; height: 56px; }
    /* S19: 원본 그림 넣기 */
    #skins { margin-top: 14px; padding: 10px; background: #f6f3ec; border-radius: 12px; font-size: 12px; color: #444; }
    #skins .row { display: flex; gap: 8px; margin: 6px 0; }
    #skins button { flex: 1; padding: 9px; border: 0; border-radius: 10px; background: #ffd54f; color: #4a3700; font-size: 13px; font-weight: 700; }
    #skins #skinclear { flex: 0 0 auto; background: #eee; color: #666; font-weight: 400; padding: 9px 12px; }
    #skins small { display: block; color: #777; line-height: 1.4; }
    #skins code { background: #eee; padding: 0 4px; border-radius: 4px; }
    #reset { margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: #eee; color: #c33; font-size: 13px; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
    <div id="hud">loading…</div>
    <div id="msg"></div>
    <!-- S21: 시작 메뉴 -->
    <div id="menu">
      <div class="card">
        <h1 id="menu-title">Peekaboo 숨바꼭질</h1>
        <button id="m-seek" class="primary">찾기 — 받은 링크로 시작</button>
        <button id="m-hide">숨기기 — 물건 뒤에 캐릭터 숨기기</button>
        <button id="m-scan" class="ghost">혼자 놀기 (주변 스캔)</button>
        <div id="m-draft" class="mrow" hidden><span></span><button id="m-draft-share">공유</button><button id="m-draft-new" class="ghost">새 코스</button></div>
        <div id="m-hides-wrap" hidden><div class="mlabel">내가 숨긴 코스</div><div id="m-hides"></div></div>
        <div id="m-score" class="mlabel"></div>
        <small>카메라·위치·나침반 권한을 허용해 주세요</small>
      </div>
    </div>
    <div id="seekbar" hidden><span id="arrow">➤</span><span id="dist"></span><button id="bypass" hidden>GPS 없이 찾기</button></div>
    <button id="tchip" hidden>목표 0/0</button>
    <div id="targets" hidden><div class="card"><h2>이 코스의 목표</h2><div id="tsum"></div><div id="tlist"></div><small>항목을 누르면 그 목표로 바꿉니다</small></div></div>
    <button id="hidebtn" hidden>여기 숨기기</button>
    <div id="hidecard" hidden>
      <div class="card">
        <h2>숨겼어요!</h2>
        <div id="hc-sp"></div>
        <div id="hc-geo"></div>
        <input id="hc-hint" maxlength="40" placeholder="힌트 문구 (선택) 예: 창가 자리 노란 컵" />
        <div class="row"><input id="hc-by" maxlength="12" placeholder="내 닉네임 (선택)" /><select id="hc-exp"><option value="0">만료 없음</option><option value="1">1일 후 만료</option><option value="7">7일 후 만료</option><option value="30">30일 후 만료</option></select></div>
        <label class="chk"><input id="hc-nohint" type="checkbox" /> 20초 뒤 물체 이름 힌트를 주지 않기 (어렵게)</label>
        <div id="hc-count"></div>
        <textarea id="hc-url" readonly rows="2"></textarea>
        <div class="row"><button id="hc-share" class="primary">코스 링크 공유</button><button id="hc-more">하나 더 숨기기</button></div>
        <div class="row"><button id="hc-reroll" class="ghost">다른 캐릭터</button></div>
        <div id="hc-msg"></div>
        <button id="hc-close" class="ghost">닫기</button>
      </div>
    </div>
    <button id="shutter" aria-label="촬영" hidden></button>
    <button id="badge" hidden>★ 0/6</button>
    <div id="panel" hidden>
      <div class="card">
        <h2>먼작귀 도감</h2>
        <div id="home"></div>
        <div id="score" class="mlabel"></div>
        <div id="slots"></div>
        <div id="skins">
          <div id="skinstat"></div>
          <div class="row">
            <button id="skinpick">원본 그림 넣기</button>
            <button id="skinclear">지우기</button>
          </div>
          <div id="skinmsg"></div>
          <input id="skinfile" type="file" accept="image/*" multiple hidden />
          <small>파일명 <code>&lt;id&gt;.png</code>(예: chiikawa.png), 흔들기 포즈는 <code>&lt;id&gt;_wave.png</code>. 이 기기에만 저장되고 서버·저장소에 올라가지 않습니다.</small>
        </div>
        <button id="reset">기억한 물체·도감 초기화</button>
      </div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
